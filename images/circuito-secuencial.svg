<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Esquema didáctico de circuito secuencial de dos cilindros</title>
  <desc id="desc">Fuente de aire alimenta dos válvulas distribuidoras manuales que accionan cilindros A y B. La secuencia de operación es A avanza, B avanza, B retorna, A retorna.</desc>
  <rect width="960" height="500" rx="24" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">Circuito secuencial didáctico: dos cilindros</text>
  <text x="480" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">Acciona manualmente las válvulas en el orden indicado</text>
  <g stroke="#2563eb" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 390 H180 V190 H250"/><path d="M180 190 V330 H250"/>
    <path d="M430 190 H535 V145 H690"/><path d="M430 220 H535 V245 H690"/>
    <path d="M430 330 H535 V285 H690"/><path d="M430 360 H535 V385 H690"/>
  </g>
  <g stroke="#0f172a" stroke-width="4" fill="#fff">
    <rect x="250" y="155" width="90" height="100"/><rect x="340" y="155" width="90" height="100"/>
    <rect x="250" y="295" width="90" height="100"/><rect x="340" y="295" width="90" height="100"/>
    <rect x="690" y="115" width="120" height="60" rx="5"/><rect x="690" y="255" width="120" height="60" rx="5"/>
  </g>
  <g stroke="#0f172a" stroke-width="3" fill="none">
    <path d="M265 235 L325 175 M325 235 L265 175 M355 175 L415 235 M355 235 L415 175"/>
    <path d="M265 375 L325 315 M325 375 L265 315 M355 315 L415 375 M355 375 L415 315"/>
    <path d="M810 145 H865 V130"/><path d="M810 285 H865 V270"/>
    <path d="M220 205 H250 M220 345 H250"/><circle cx="205" cy="205" r="14"/><circle cx="205" cy="345" r="14"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">
    <text x="78" y="425">Alimentación</text><text x="285" y="280">Válvula A</text><text x="285" y="420">Válvula B</text>
    <text x="740" y="105" text-anchor="middle">Cilindro A</text><text x="740" y="245" text-anchor="middle">Cilindro B</text>
    <text x="480" y="455" text-anchor="middle" fill="#1d4ed8">Secuencia: 1) A+  →  2) B+  →  3) B−  →  4) A−</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#475569"><text x="205" y="180" text-anchor="middle">Mando A</text><text x="205" y="320" text-anchor="middle">Mando B</text></g>
  <text x="480" y="483" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Esquema funcional simplificado: reproduce las conexiones con los componentes equivalentes disponibles en Picuino.</text>
</svg>
